<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Anmol Tripathi — Data Science, Machine Learning and Applied AI</title>
  <desc id="desc">Professional dark technical banner with a connected data and machine learning motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b172a"/>
      <stop offset="1" stop-color="#101b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#7dd3fc" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1400" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1400" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="1270" cy="72" r="190" fill="#4f46e5" opacity=".08"/>
  <circle cx="1120" cy="420" r="210" fill="#06b6d4" opacity=".065"/>
  <g opacity=".65" stroke="url(#accent)" stroke-width="2">
    <path d="M1030 86L1150 54L1274 120L1198 214L1320 286"/>
    <path d="M1030 86L1070 208L1198 214L1130 326L1320 286"/>
    <path d="M1070 208L980 304L1130 326"/>
  </g>
  <g fill="#0b172a" stroke="#67e8f9" stroke-width="3" filter="url(#glow)">
    <circle cx="1030" cy="86" r="8"/><circle cx="1150" cy="54" r="7"/>
    <circle cx="1274" cy="120" r="10"/><circle cx="1070" cy="208" r="9"/>
    <circle cx="1198" cy="214" r="12"/><circle cx="1320" cy="286" r="8"/>
    <circle cx="1130" cy="326" r="10"/><circle cx="980" cy="304" r="7"/>
  </g>
  <rect x="84" y="72" width="112" height="7" rx="3.5" fill="url(#accent)"/>
  <text x="84" y="148" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-.8">Anmol Tripathi</text>
  <text x="86" y="201" fill="#a5f3fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" letter-spacing="2.2">QUALITY DATA SCIENTIST · ML · APPLIED AI</text>
  <text x="86" y="259" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Building evaluated, reproducible and deployable intelligent systems</text>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" fill="#94a3b8">
    <text x="86" y="324">DATA → EVIDENCE → MODELS → DECISIONS</text>
  </g>
  <rect x="84" y="353" width="760" height="2" rx="1" fill="url(#accent)" opacity=".6"/>
</svg>
